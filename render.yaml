# Render Blueprint — provisions the web service only.
# DATABASE_URL is set manually in the Render dashboard (points at Neon, our
# permanent free Postgres) — render.yaml intentionally doesn't manage it,
# because the prior `fromDatabase` link to a Render-hosted free Postgres
# expired after 30 days. Neon is free forever.

services:
  - type: web
    name: etoro-ux-feedback
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FEEDBACK_READ_TOKEN
        sync: false
      # ANTHROPIC_API_KEY — the etoro pilot key. Set manually in the Render
      # dashboard; the /api/claude proxy uses it to call Anthropic server-to-
      # server. Never commit the value (this file is in the public mirror).
      - key: ANTHROPIC_API_KEY
        sync: false
      # PROXY_TOKEN — shared secret the plugin sends as the x-proxy-token
      # header. Must match CLAUDE_PROXY_TOKEN in ui.html. Set in dashboard.
      - key: PROXY_TOKEN
        sync: false
