<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UX Writing Agent — Feedback Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0c10;
      --surface: #14141a;
      --surface2: #1c1c25;
      --border: #2a2a38;
      --text: #f0f0f5;
      --muted: #7878a0;
      --blue: #0d99ff;
      --green: #22c97a;
      --red: #ef4444;
      --amber: #f59e0b;
      --purple: #8b5cf6;
    }
    body {
      font-family: Inter, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 24px 64px;
    }
    .page { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 32px; }
    .eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--blue); margin-bottom: 6px;
    }
    .header h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; color: var(--muted); }

    .toolbar {
      display: flex; gap: 8px; align-items: center; margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .toolbar button, .toolbar select {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 6px 12px; border-radius: 6px;
      font: 500 12px/1 Inter, sans-serif; cursor: pointer;
    }
    .toolbar button:hover, .toolbar select:hover { border-color: var(--blue); }
    .toolbar .spacer { flex: 1; }
    .toolbar .meta { font-size: 12px; color: var(--muted); }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      padding: 14px 16px; border-radius: 8px;
    }
    .stat .label {
      font-size: 11px; color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .stat .value { font-size: 24px; font-weight: 700; }
    .stat .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      padding: 18px; border-radius: 8px;
    }
    .card h2 {
      font-size: 13px; font-weight: 700; margin-bottom: 12px;
      color: var(--text); letter-spacing: 0.02em;
    }
    .bar-row {
      display: grid; grid-template-columns: 120px 1fr 40px;
      gap: 8px; align-items: center; padding: 4px 0;
      font-size: 12px;
    }
    .bar-row .name { color: var(--muted); text-transform: capitalize; }
    .bar-row .bar {
      height: 10px; background: var(--surface2); border-radius: 4px; overflow: hidden;
    }
    .bar-row .bar-fill {
      height: 100%; background: var(--blue); border-radius: 4px;
    }
    .bar-row.up .bar-fill { background: var(--green); }
    .bar-row.down .bar-fill { background: var(--red); }
    .bar-row.apply .bar-fill { background: var(--green); }
    .bar-row.dismiss .bar-fill, .bar-row .bar-fill { }
    .bar-row .count { text-align: right; color: var(--muted); }

    .events {
      background: var(--surface); border: 1px solid var(--border);
      padding: 18px; border-radius: 8px;
    }
    .events h2 { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
    .event {
      padding: 12px 0; border-bottom: 1px solid var(--border);
      font-size: 12px; display: grid;
      grid-template-columns: 70px 110px 110px 1fr; gap: 12px; align-items: flex-start;
    }
    .event:last-child { border-bottom: none; }
    .event .time { color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 4px; }
    .event .type {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; background: var(--surface2); color: var(--muted);
      width: fit-content; margin-top: 4px;
    }
    .event .type.rating { background: rgba(13,153,255,0.15); color: var(--blue); }
    .event .type.rating-comment { background: rgba(139,92,246,0.15); color: var(--purple); }
    .event .type.apply, .event .type.apply-grouped, .event .type.apply-structure, .event .type.mark-reviewed {
      background: rgba(34,201,122,0.15); color: var(--green);
    }
    .event .type.dismiss, .event .type.dismiss-grouped, .event .type.dismiss-finding, .event .type.reject-rewrite {
      background: rgba(239,68,68,0.15); color: var(--red);
    }
    .event .type.session-feedback { background: rgba(245,158,11,0.15); color: var(--amber); }
    .event .type.override { background: rgba(245,158,11,0.15); color: var(--amber); }
    .event .summary { color: var(--text); }
    .event .summary .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .event .summary .diff { margin-top: 6px; font-size: 11px; }
    .event .summary .diff .orig {
      color: var(--muted); text-decoration: line-through;
      text-decoration-color: rgba(239,68,68,0.5);
    }
    .event .summary .diff .new { color: var(--text); font-weight: 600; }
    .event .summary .diff .arrow { color: var(--muted); margin: 0 6px; }
    .event .summary .rule-chip {
      display: inline-block; font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted); padding: 2px 5px; background: var(--surface2);
      border-radius: 3px; margin-left: 6px;
    }

    /* Inline thumbnail: small preview of the frame the user was looking at,
       with a red highlight rectangle drawn over the specific layer. Click to
       expand into the modal at full size. */
    .event .thumb {
      position: relative; width: 100px; height: 130px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .event .thumb.empty { cursor: default; }
    .event .thumb:hover:not(.empty) { border-color: var(--blue); }
    .event .thumb img {
      max-width: 100%; max-height: 100%; display: block;
      object-fit: contain;
    }
    .event .thumb .hl-box {
      position: absolute; border: 2px solid #ff3b30;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .event .thumb .none {
      color: var(--muted); font-size: 10px; text-align: center;
      padding: 6px; line-height: 1.3;
    }

    .empty {
      padding: 40px; text-align: center; color: var(--muted); font-size: 13px;
    }
    .empty.error { color: var(--red); }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; padding: 24px;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal .imgWrap { position: relative; display: inline-block; }
    .modal img { max-width: 100%; max-height: 90vh; border-radius: 4px; display: block; }
    .modal .hl-box {
      position: absolute; border: 3px solid #ff3b30;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
      pointer-events: none; display: none;
    }
    .modal .close {
      position: absolute; top: 16px; right: 16px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 6px 12px; border-radius: 6px;
      cursor: pointer; font: 600 12px/1 Inter, sans-serif;
    }

    .login {
      max-width: 380px; margin: 80px auto; background: var(--surface);
      border: 1px solid var(--border); padding: 24px; border-radius: 8px;
    }
    .login h2 { font-size: 16px; margin-bottom: 6px; }
    .login p { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .login input {
      width: 100%; padding: 8px 10px; background: var(--surface2);
      border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; font: 13px/1 Inter, sans-serif; margin-bottom: 10px;
    }
    .login input:focus { outline: none; border-color: var(--blue); }
    .login button {
      width: 100%; padding: 10px; background: var(--blue); color: #fff;
      border: none; border-radius: 4px; font: 600 13px/1 Inter, sans-serif; cursor: pointer;
    }
    .login button:hover { background: #0a85e0; }
    .login .error { color: var(--red); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="page" id="page" hidden>
    <div class="header">
      <div class="eyebrow">UX Writing Agent</div>
      <h1>Feedback dashboard</h1>
      <p id="lastUpdated">Loading…</p>
    </div>

    <div class="toolbar">
      <button id="refreshBtn">Refresh</button>
      <select id="rangeSel">
        <option value="all">All time</option>
        <option value="day">Last 24h</option>
        <option value="week" selected>Last 7 days</option>
        <option value="month">Last 30 days</option>
      </select>
      <select id="typeSel">
        <option value="all">All event types</option>
        <option value="rating">Ratings only</option>
        <option value="apply">Applies only</option>
        <option value="dismiss">Dismisses only</option>
        <option value="comment">With comments</option>
        <option value="session">Session feedback</option>
      </select>
      <div class="spacer"></div>
      <span class="meta" id="totalLabel"></span>
      <button id="formResponsesBtn" title="Open Microsoft Forms responses in a new tab" hidden>Form responses ↗</button>
      <button id="exportBtn">Export CSV</button>
      <button id="clearBtn" title="Wipe all stored events" style="color:#ef4444; border-color:#ef4444;">Clear all</button>
      <button id="signOutBtn" title="Forget token on this device">Sign out</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="grid">
      <div class="card">
        <h2>By event type</h2>
        <div id="byType"></div>
      </div>
      <div class="card">
        <h2>By category (ratings only)</h2>
        <div id="byCategory"></div>
      </div>
    </div>

    <div class="events">
      <h2>Recent events</h2>
      <div id="eventsList"></div>
    </div>
  </div>

  <div class="login" id="login" hidden>
    <h2>Sign in</h2>
    <p>Paste your dashboard read token. Stored locally in your browser only.</p>
    <input type="password" id="tokenInput" placeholder="Token" autocomplete="off" />
    <button id="loginBtn">Continue</button>
    <div class="error" id="loginError"></div>
  </div>

  <div class="modal" id="imgModal">
    <button class="close" id="closeModal">Close</button>
    <div class="imgWrap">
      <img id="modalImg" alt="Screenshot" />
      <div class="hl-box" id="modalOverlay"></div>
    </div>
  </div>

<script>
(function () {
  var TOKEN_KEY = "uxwa-feedback-token";
  // FORM_RESPONSES_URL — paste the URL of your Microsoft Forms "Responses"
  // tab here (Forms editor → top tab "Responses" → copy the page URL). When
  // set, a "Form responses ↗" button appears in the toolbar so you can jump
  // to the long-form weekly feedback from this dashboard in one click.
  // Leave empty to hide the button.
  var FORM_RESPONSES_URL = "https://forms.office.com/Pages/DesignPageV2.aspx?origin=NeoPortalPage&subpage=design&id=8ri3hLkAhkiA0kKWMWx4KVddZfUKvhBPlHpWd5CEp-5UNzg1Q1VCNVFSRjU4M0Q1UUVSODgyN1kyVy4u&analysis=true";

  var page = document.getElementById("page");
  var login = document.getElementById("login");
  var token = localStorage.getItem(TOKEN_KEY) || "";
  var events = [];

  function showLogin(errMsg) {
    page.hidden = true;
    login.hidden = false;
    document.getElementById("loginError").textContent = errMsg || "";
    setTimeout(function () { document.getElementById("tokenInput").focus(); }, 30);
  }
  function showDashboard() {
    page.hidden = false;
    login.hidden = true;
  }

  document.getElementById("loginBtn").addEventListener("click", function () {
    var v = document.getElementById("tokenInput").value.trim();
    if (!v) return;
    token = v;
    localStorage.setItem(TOKEN_KEY, token);
    load();
  });
  document.getElementById("tokenInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });
  document.getElementById("signOutBtn").addEventListener("click", function () {
    localStorage.removeItem(TOKEN_KEY);
    token = "";
    showLogin();
  });
  document.getElementById("refreshBtn").addEventListener("click", load);
  document.getElementById("rangeSel").addEventListener("change", render);
  document.getElementById("typeSel").addEventListener("change", render);
  document.getElementById("exportBtn").addEventListener("click", exportCsv);
  document.getElementById("clearBtn").addEventListener("click", clearAll);

  // Surface the Microsoft Forms responses button if a URL is configured —
  // gives Michael one-click access to both feedback destinations so he
  // doesn't have to remember to check Forms separately each week.
  if (FORM_RESPONSES_URL) {
    var formBtn = document.getElementById("formResponsesBtn");
    formBtn.hidden = false;
    formBtn.addEventListener("click", function () {
      window.open(FORM_RESPONSES_URL, "_blank", "noopener,noreferrer");
    });
  }
  document.getElementById("closeModal").addEventListener("click", function () {
    document.getElementById("imgModal").classList.remove("show");
  });

  function load() {
    if (!token) { showLogin(); return; }
    document.getElementById("lastUpdated").textContent = "Loading…";
    fetch("/api/feedback?token=" + encodeURIComponent(token) + "&limit=1000", {
      cache: "no-store",
    })
      .then(function (r) {
        if (r.status === 403) { showLogin("Token rejected."); throw new Error("403"); }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        events = data.events || [];
        showDashboard();
        render();
        document.getElementById("lastUpdated").textContent =
          "Updated " + new Date().toLocaleTimeString() + " · " + events.length + " events loaded";
      })
      .catch(function (err) {
        if (err.message !== "403") {
          document.getElementById("lastUpdated").textContent = "Couldn't load: " + err.message;
        }
      });
  }

  function filtered() {
    var range = document.getElementById("rangeSel").value;
    var typeFilter = document.getElementById("typeSel").value;
    var cutoff = 0;
    if (range === "day") cutoff = Date.now() - 24 * 3600 * 1000;
    else if (range === "week") cutoff = Date.now() - 7 * 24 * 3600 * 1000;
    else if (range === "month") cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    return events.filter(function (ev) {
      var ts = ev.receivedAt ? Date.parse(ev.receivedAt) : 0;
      if (cutoff && ts < cutoff) return false;
      var t = ev.eventType || "";
      if (typeFilter === "rating") return t === "rating" || t === "rating-comment";
      if (typeFilter === "apply") return /^(apply|mark-reviewed)/.test(t);
      if (typeFilter === "dismiss") return /^(dismiss|reject)/.test(t);
      if (typeFilter === "comment") return !!ev.comment;
      if (typeFilter === "session") return t === "session-feedback";
      return true;
    });
  }

  function render() {
    var rows = filtered();
    document.getElementById("totalLabel").textContent =
      rows.length + " of " + events.length + " events";
    renderStats(rows);
    renderByType(rows);
    renderByCategory(rows);
    renderList(rows);
  }

  function renderStats(rows) {
    var byType = {};
    var sessionScores = [];
    var ups = 0, downs = 0, applies = 0, dismisses = 0;
    for (var i = 0; i < rows.length; i++) {
      var ev = rows[i];
      var t = ev.eventType || "unknown";
      byType[t] = (byType[t] || 0) + 1;
      if (t === "rating" && ev.rating === "up") ups++;
      if (t === "rating" && ev.rating === "down") downs++;
      if (/^(apply|mark-reviewed)/.test(t)) applies++;
      if (/^(dismiss|reject)/.test(t)) dismisses++;
      if (t === "session-feedback" && typeof ev.score === "number") sessionScores.push(ev.score);
    }
    var ratingTotal = ups + downs;
    var helpfulPct = ratingTotal ? Math.round((ups / ratingTotal) * 100) : null;
    var avgSession = sessionScores.length
      ? (sessionScores.reduce(function (a, b) { return a + b; }, 0) / sessionScores.length).toFixed(1)
      : null;
    var applyRate = (applies + dismisses) ? Math.round((applies / (applies + dismisses)) * 100) : null;

    var el = document.getElementById("stats");
    el.innerHTML = "";
    el.appendChild(stat("Total events", rows.length, ""));
    el.appendChild(stat("👍 / 👎", ups + " / " + downs, helpfulPct === null ? "—" : helpfulPct + "% positive"));
    el.appendChild(stat("Accept / Dismiss", applies + " / " + dismisses, applyRate === null ? "—" : applyRate + "% accepted"));
    el.appendChild(stat("Session score (avg)", avgSession === null ? "—" : avgSession + " / 5", sessionScores.length + " ratings"));
  }

  function stat(label, value, sub) {
    var d = document.createElement("div");
    d.className = "stat";
    d.innerHTML =
      '<div class="label">' + escapeHtml(label) + '</div>' +
      '<div class="value">' + escapeHtml(String(value)) + '</div>' +
      '<div class="sub">' + escapeHtml(sub || "") + '</div>';
    return d;
  }

  function renderByType(rows) {
    var counts = {};
    for (var i = 0; i < rows.length; i++) {
      var t = rows[i].eventType || "unknown";
      counts[t] = (counts[t] || 0) + 1;
    }
    var entries = Object.keys(counts).map(function (k) { return [k, counts[k]]; });
    entries.sort(function (a, b) { return b[1] - a[1]; });
    var max = entries.length ? entries[0][1] : 1;
    var html = entries.map(function (e) {
      var pct = max ? (e[1] / max) * 100 : 0;
      var rowClass = "";
      if (/^apply|mark-reviewed/.test(e[0])) rowClass = "apply";
      if (/^dismiss|reject/.test(e[0])) rowClass = "down";
      return (
        '<div class="bar-row ' + rowClass + '">' +
        '<div class="name">' + escapeHtml(e[0]) + '</div>' +
        '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="count">' + e[1] + '</div>' +
        '</div>'
      );
    }).join("");
    document.getElementById("byType").innerHTML = html || "<div class=\"empty\">No events.</div>";
  }

  function renderByCategory(rows) {
    var counts = { up: {}, down: {} };
    for (var i = 0; i < rows.length; i++) {
      var ev = rows[i];
      if (ev.eventType !== "rating" && ev.eventType !== "rating-comment") continue;
      if (!ev.rating || !ev.category) continue;
      counts[ev.rating] = counts[ev.rating] || {};
      counts[ev.rating][ev.category] = (counts[ev.rating][ev.category] || 0) + 1;
    }
    var cats = {};
    Object.keys(counts).forEach(function (dir) {
      Object.keys(counts[dir]).forEach(function (c) {
        cats[c] = (cats[c] || 0) + counts[dir][c];
      });
    });
    var entries = Object.keys(cats).map(function (k) { return [k, cats[k], counts.up[k] || 0, counts.down[k] || 0]; });
    entries.sort(function (a, b) { return b[1] - a[1]; });
    var max = entries.length ? entries[0][1] : 1;
    var html = entries.map(function (e) {
      var pct = max ? (e[1] / max) * 100 : 0;
      var upPct = e[1] ? (e[2] / e[1]) * 100 : 0;
      return (
        '<div class="bar-row">' +
        '<div class="name">' + escapeHtml(e[0]) + '</div>' +
        '<div class="bar">' +
          '<div class="bar-fill" style="width:' + pct + '%; background: linear-gradient(to right, #22c97a 0%, #22c97a ' + upPct + '%, #ef4444 ' + upPct + '%, #ef4444 100%);"></div>' +
        '</div>' +
        '<div class="count">' + e[2] + '/' + e[3] + '</div>' +
        '</div>'
      );
    }).join("");
    document.getElementById("byCategory").innerHTML = html || "<div class=\"empty\">No rated findings yet.</div>";
  }

  // Keep rendered events around so the modal can re-read the layerBox without
  // re-fetching the API.
  var lastRenderedById = {};

  function renderList(rows) {
    var el = document.getElementById("eventsList");
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No events match these filters.</div>';
      return;
    }
    lastRenderedById = {};
    var html = rows.slice(0, 200).map(function (ev) {
      lastRenderedById[ev.id] = ev;
      var t = ev.eventType || "unknown";
      var time = ev.receivedAt ? new Date(ev.receivedAt).toLocaleString([], {
        month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
      }) : "—";
      var label = t;
      if (t === "rating") label = ev.rating === "up" ? "👍 rating" : (ev.rating === "down" ? "👎 rating" : "rating");
      if (t === "rating-comment") label = (ev.rating === "up" ? "👍" : "👎") + " comment";
      var summary = "";
      if (t === "session-feedback") {
        summary = "Session score: " + (ev.score || "—") + "/5" +
                  (ev.runType ? " · " + ev.runType : "") +
                  (typeof ev.findingsCount === "number" ? " · " + ev.findingsCount + " findings" : "");
      } else {
        summary = (ev.category ? "[" + ev.category + "] " : "") + (ev.summary || ev.layerName || "");
      }
      var ruleChip = ev.ruleId ? '<span class="rule-chip">' + escapeHtml(ev.ruleId) + '</span>' : "";
      // Before-and-after diff: shows the original copy and what the model proposed,
      // so each row reads as "here's the finding the PM saw."
      var diff = "";
      if (ev.currentText || ev.suggestion) {
        diff =
          '<div class="diff">' +
          (ev.currentText ? '<span class="orig">' + escapeHtml(ev.currentText) + '</span>' : '') +
          (ev.currentText && ev.suggestion ? '<span class="arrow">→</span>' : '') +
          (ev.suggestion ? '<span class="new">' + escapeHtml(ev.suggestion) + '</span>' : '') +
          '</div>';
      }
      var meta = [];
      if (ev.userName) meta.push("by " + ev.userName);
      if (ev.screenName) meta.push(ev.screenName);
      if (ev.scope) meta.push("scope: " + ev.scope);
      if (ev.comment) meta.push("“" + ev.comment + "”");

      // Thumbnail: small preview of the frame with the layer highlighted, so
      // you can see at a glance what the pilot user was looking at when they
      // gave feedback. Click to expand in the modal.
      var thumb;
      if (ev.hasImage) {
        var thumbImgSrc = "/api/feedback/image/" + encodeURIComponent(ev.id) +
          "?token=" + encodeURIComponent(token);
        thumb =
          '<div class="thumb" data-id="' + escapeHtml(ev.id) + '" title="Click to expand">' +
          '<img src="' + thumbImgSrc + '" alt="Screenshot" />' +
          '<div class="hl-box" data-overlay="' + escapeHtml(ev.id) + '" style="display:none"></div>' +
          '</div>';
      } else {
        thumb = '<div class="thumb empty"><div class="none">no screenshot</div></div>';
      }

      return (
        '<div class="event">' +
        '<div class="time">' + escapeHtml(time) + '</div>' +
        '<div><span class="type ' + escapeHtml(t) + '">' + escapeHtml(label) + '</span></div>' +
        thumb +
        '<div class="summary">' + escapeHtml(summary) + ruleChip +
          diff +
          (meta.length ? '<div class="meta">' + escapeHtml(meta.join(" · ")) + '</div>' : '') +
        '</div>' +
        '</div>'
      );
    }).join("");
    el.innerHTML = html;

    // Wire thumbnail clicks → modal, and draw highlight overlays once the
    // thumbnail images load (need the rendered img size to scale layerBox).
    var thumbs = el.querySelectorAll(".thumb[data-id]");
    for (var i = 0; i < thumbs.length; i++) {
      (function (thumbEl) {
        var id = thumbEl.getAttribute("data-id");
        thumbEl.addEventListener("click", function () { showImage(id); });
        var img = thumbEl.querySelector("img");
        var overlay = thumbEl.querySelector(".hl-box");
        if (img && overlay) {
          var positionOverlay = function () {
            var ev = lastRenderedById[id];
            if (!ev || !ev.layerBox || !ev.layerBox.frameWidth || !ev.layerBox.frameHeight) return;
            // Render-size of the contained image inside the thumb. object-fit: contain
            // means the img tag is the container size, but the actual image draws within
            // it preserving aspect ratio — recompute drawn box.
            var containerW = thumbEl.clientWidth;
            var containerH = thumbEl.clientHeight;
            var scale = Math.min(containerW / ev.layerBox.frameWidth, containerH / ev.layerBox.frameHeight);
            var drawnW = ev.layerBox.frameWidth * scale;
            var drawnH = ev.layerBox.frameHeight * scale;
            var offsetX = (containerW - drawnW) / 2;
            var offsetY = (containerH - drawnH) / 2;
            overlay.style.left = (offsetX + ev.layerBox.x * scale) + "px";
            overlay.style.top = (offsetY + ev.layerBox.y * scale) + "px";
            overlay.style.width = (ev.layerBox.width * scale) + "px";
            overlay.style.height = (ev.layerBox.height * scale) + "px";
            overlay.style.display = "block";
          };
          if (img.complete) positionOverlay();
          else img.addEventListener("load", positionOverlay);
        }
      })(thumbs[i]);
    }
  }

  function showImage(id) {
    var modal = document.getElementById("imgModal");
    var img = document.getElementById("modalImg");
    var overlay = document.getElementById("modalOverlay");
    if (overlay) overlay.style.display = "none";
    img.onload = function () {
      var ev = lastRenderedById[id];
      if (!ev || !ev.layerBox || !overlay) return;
      var box = ev.layerBox;
      if (!box.frameWidth || !box.frameHeight) return;
      var scale = img.clientWidth / box.frameWidth;
      overlay.style.left = (img.offsetLeft + box.x * scale) + "px";
      overlay.style.top = (img.offsetTop + box.y * scale) + "px";
      overlay.style.width = (box.width * scale) + "px";
      overlay.style.height = (box.height * scale) + "px";
      overlay.style.display = "block";
    };
    img.src = "/api/feedback/image/" + encodeURIComponent(id) + "?token=" + encodeURIComponent(token);
    modal.classList.add("show");
  }

  function clearAll() {
    var msg =
      "Delete ALL " + events.length + " events from the database?\n\n" +
      "This cannot be undone. If you wanted to keep a copy, click Export CSV first.";
    if (!confirm(msg)) return;
    fetch("/api/feedback?token=" + encodeURIComponent(token), {
      method: "DELETE",
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        alert("Deleted " + (data.deleted || 0) + " events.");
        events = [];
        load();
      })
      .catch(function (err) {
        alert("Couldn't clear: " + err.message);
      });
  }

  function exportCsv() {
    var rows = filtered();
    if (!rows.length) return;
    var cols = [
      "receivedAt", "userName", "userId", "eventType", "rating", "comment", "score",
      "runType", "screensReviewed", "findingsCount",
      "category", "summary", "screenName", "layerName", "scope",
      "findingId", "layerId", "id",
    ];
    var csv = cols.join(",") + "\n";
    for (var i = 0; i < rows.length; i++) {
      var ev = rows[i];
      csv += cols.map(function (c) {
        var v = ev[c];
        if (v === null || v === undefined) return "";
        var s = String(v).replace(/"/g, '""');
        return /[,"\n]/.test(s) ? '"' + s + '"' : s;
      }).join(",") + "\n";
    }
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ux-writing-agent-feedback-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  if (token) load(); else showLogin();
})();
</script>
</body>
</html>
